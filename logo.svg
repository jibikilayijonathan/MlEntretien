<svg xmlns="http://www.w3.org/2000/svg" viewBox="64 64 384 384" width="384" height="384" role="img" aria-label="MEL ENTRETIEN">
  <title>MEL ENTRETIEN</title>

  <!-- Anneau extérieur -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#1B4B9E" stroke-width="13" />

