    <path d="M338 143 C338 155, 341 158, 353 158 C341 158, 338 161, 338 173 C338 161, 335 158, 323 158 C335 158, 338 155, 338 143 Z" />
    <path d="M318 170 C318 191, 323 196, 344 196 C323 196, 318 201, 318 222 C318 201, 313 196, 292 196 C313 196, 318 191, 318 170 Z" />
  </g>
</svg>
